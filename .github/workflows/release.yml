name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-pict-win:
    name: Build static pict.exe
    runs-on: windows-latest
    steps:
      - name: Clone microsoft/pict
        run: git clone --depth 1 https://github.com/microsoft/pict pict-src

      - name: Build with static CRT
        run: |
          cmake -S pict-src -B pict-src/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build pict-src/build --config Release

      - name: Stage pict.exe
        shell: pwsh
        run: |
          $exe = Get-ChildItem -Path pict-src/build -Filter pict.exe -Recurse | Select-Object -First 1
          if (-not $exe) { throw "pict.exe not found after build" }
          Write-Host "Found: $($exe.FullName)"
          Copy-Item $exe.FullName pict.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pict-win
          path: pict.exe

  build-pict-linux:
    name: Build pict (Linux)
    runs-on: ubuntu-latest
    steps:
      - name: Clone microsoft/pict
        run: git clone --depth 1 https://github.com/microsoft/pict pict-src

      - name: Build
        run: |
          cmake -DCMAKE_BUILD_TYPE=Release -S pict-src -B pict-src/build
          cmake --build pict-src/build

      - name: Stage pict
        run: |
          exe=$(find pict-src/build -name pict -type f | head -1)
          if [ -z "$exe" ]; then echo "pict not found after build" && exit 1; fi
          echo "Found: $exe"
          cp "$exe" pict

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pict-linux
          path: pict

  build-app-win:
    name: Build app (Windows)
    runs-on: windows-latest
    needs: [build-pict-win]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download static pict.exe
        uses: actions/download-artifact@v4
        with:
          name: pict-win
          path: binaries

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Windows executable
        run: bun run build:dist:windows

      - name: Upload Windows app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-win
          path: dist/pairwise-tui.exe

  build-app-linux:
    name: Build app (Linux)
    runs-on: ubuntu-latest
    needs: [build-pict-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download pict (Linux)
        uses: actions/download-artifact@v4
        with:
          name: pict-linux
          path: binaries

      - name: Make pict executable
        run: chmod +x binaries/pict

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build Linux executable
        run: bun run build:dist:linux

      - name: Upload Linux app artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-linux
          path: dist/pairwise-tui

  package-appimage-linux:
    name: Package AppImage (Linux)
    runs-on: ubuntu-latest
    needs: [build-app-linux]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download Linux app artifact
        uses: actions/download-artifact@v4
        with:
          name: app-linux
          path: dist

      - name: Download appimagetool
        run: curl -L "https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage" -o dist/appimagetool.AppImage

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Package AppImage
        run: bun run package:appimage

      - name: Upload AppImage artifact
        uses: actions/upload-artifact@v4
        with:
          name: appimage-linux
          path: dist/Pairwise-TUI-x86_64.AppImage

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-app-win, build-app-linux, package-appimage-linux]

    steps:
      - name: Download Windows app artifact
        uses: actions/download-artifact@v4
        with:
          name: app-win
          path: dist

      - name: Download Linux app artifact
        uses: actions/download-artifact@v4
        with:
          name: app-linux
          path: dist

      - name: Download Linux AppImage artifact
        uses: actions/download-artifact@v4
        with:
          name: appimage-linux
          path: dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pairwise-tui
            dist/pairwise-tui.exe
            dist/Pairwise-TUI-x86_64.AppImage
          generate_release_notes: true
