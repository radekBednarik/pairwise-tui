name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build-pict-win:
    name: Build static pict.exe
    runs-on: windows-latest
    steps:
      - name: Clone microsoft/pict
        run: git clone --depth 1 https://github.com/microsoft/pict pict-src

      - name: Build with static CRT
        run: |
          cmake -S pict-src -B pict-src/build `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded
          cmake --build pict-src/build --config Release

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: pict-win
          path: pict-src/build/cli/pict.exe

  release:
    name: Build and Release
    runs-on: ubuntu-latest
    needs: build-pict-win

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download static pict.exe
        uses: actions/download-artifact@v4
        with:
          name: pict-win
          path: binaries

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build
        run: bun run build::dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/pairwise-tui
            dist/pairwise-tui.exe
          generate_release_notes: true
